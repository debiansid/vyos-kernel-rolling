name: Build VyOS rolling Fullcone kernel

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vyos-rolling-fullcone-kernel
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    container:
      image: vyos/vyos-build:rolling
      options: --privileged
    outputs:
      artifact: ${{ steps.meta.outputs.artifact }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout Fullcone patches
        uses: actions/checkout@v6
        with:
          path: fullcone

      - name: Checkout current VyOS rolling builder
        uses: actions/checkout@v6
        with:
          repository: vyos/vyos-build
          ref: rolling
          path: vyos-build

      - name: Add Alpine Fullcone patch set
        shell: bash
        run: |
          set -euo pipefail
          install -m 0644 fullcone/patches/kernel/*.patch \
            vyos-build/scripts/package-build/linux-kernel/patches/kernel/
          install -m 0644 fullcone/config/21-fullcone.config \
            vyos-build/scripts/package-build/linux-kernel/config/

      - name: Build kernel packages
        working-directory: vyos-build/scripts/package-build/linux-kernel
        shell: bash
        run: |
          set -euo pipefail
          sudo --preserve-env ./build.py --config package.toml --packages linux-kernel

      - name: Verify kernel package
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          kernel=$(sed -n 's/^kernel_version = "\([^"]*\)"/\1/p' vyos-build/data/defaults.toml)
          package="vyos-build/scripts/package-build/linux-kernel/linux-image-${kernel}-vyos_${kernel}-1_amd64.deb"
          test -f "$package"
          mkdir kernel-root
          dpkg-deb --extract "$package" kernel-root
          module=$(find kernel-root -type f -name 'nft_fullcone.ko*' -print -quit)
          test -n "$module"
          test -s "$module"
          test "$(dpkg-deb --field "$package" Package)" = "linux-image-${kernel}-vyos"
          test "$(dpkg-deb --field "$package" Version)" = "${kernel}-1"
          artifact="vyos-kernel-${kernel}-fullcone"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "tag=${kernel}-fullcone.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Upload kernel packages
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: vyos-build/scripts/package-build/linux-kernel/linux-*.deb
          retention-days: 7
          if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout boot test
        uses: actions/checkout@v6
        with:
          path: fullcone

      - name: Download kernel packages
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: kernel-packages

      - name: Build Debian test initramfs
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cpio debootstrap qemu-system-x86
          sudo debootstrap --variant=minbase bookworm rootfs http://deb.debian.org/debian
          sudo chroot rootfs apt-get install -y --no-install-recommends \
            conntrack iproute2 kmod nftables socat

          mkdir fullcone-packages
          download() {
            url=$1
            sha256=$2
            file="fullcone-packages/${url##*/}"
            curl -fL --retry 3 -o "$file" "$url"
            echo "$sha256  $file" | sha256sum --check -
          }
          download https://github.com/homerouter/libnftnl-fullcone/releases/download/1.3.2-1/libnftnl11_1.3.2-1_amd64.deb \
            0b8d23f7cb0b190213a862002baf51ab5ff8f0e5e081b8a0edd7f082553a7158
          download https://github.com/homerouter/nftables-fullcone/releases/download/1.1.7-1/libnftables1_1.1.7-1_amd64.deb \
            ef911f2b628e40434d18adc0bebdc82ed75994bc971a52d84304c3e215e4d45e
          download https://github.com/homerouter/nftables-fullcone/releases/download/1.1.7-1/nftables_1.1.7-1_amd64.deb \
            dc32985b2d69de10a87e63a26d9251d485ec07eb6945d81ee959b28fa1610175

          sudo cp fullcone-packages/*.deb rootfs/tmp/
          sudo chroot rootfs sh -c 'dpkg -i /tmp/*.deb'
          sudo dpkg-deb --extract kernel-packages/linux-image-*.deb rootfs
          sudo install -m 0755 fullcone/tests/fullcone-boot-test.sh rootfs/init
          sudo rm -f rootfs/dev/console
          sudo mknod -m 0600 rootfs/dev/console c 5 1
          cp rootfs/boot/vmlinuz-* vmlinuz
          sudo sh -c 'cd rootfs && find . -print0 | cpio --null -o --format=newc | gzip -1 > ../initramfs.cpio.gz'

      - name: Boot and exercise both Fullcone paths
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=KILL 180s qemu-system-x86_64 \
            -machine accel=tcg \
            -cpu max \
            -m 768M \
            -smp 2 \
            -kernel vmlinuz \
            -initrd initramfs.cpio.gz \
            -append 'console=ttyS0 rdinit=/init panic=-1' \
            -nographic \
            -no-reboot 2>&1 | tr -d '\r' | tee console.log
          grep -q '^FULLCONE_PATH_PASS name=fullcone ' console.log
          grep -q '^FULLCONE_PATH_PASS name=brcm ' console.log
          grep -q '^FULLCONE_TEST_PASS$' console.log

      - name: Upload boot log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.build.outputs.artifact }}-boot-log
          path: console.log
          retention-days: 7
          if-no-files-found: ignore

  release:
    needs: [build, test]
    runs-on: ubuntu-24.04
    steps:
      - name: Download kernel packages
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        shell: bash
        run: |
          gh release create "$TAG" release/*.deb \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "VyOS rolling kernel $TAG" \
            --notes "VyOS rolling kernel with the homerouter/aports Fullcone and Broadcom Fullcone patch set. Both paths passed the QEMU network-namespace test." \
            --prerelease
