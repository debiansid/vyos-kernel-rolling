name: Build VyOS rolling Fullcone kernel and drivers

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vyos-rolling-fullcone-kernel
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    container:
      image: vyos/vyos-build:rolling
      options: --privileged
    outputs:
      artifact: ${{ steps.meta.outputs.artifact }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout kernel build scripts
        uses: actions/checkout@v6
        with:
          path: fullcone

      - name: Checkout current VyOS rolling builder
        uses: actions/checkout@v6
        with:
          repository: vyos/vyos-build
          ref: rolling
          path: vyos-build

      - name: Install current VyOS kernel build dependencies
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t dependencies < <(python3 -c 'import tomllib; print(*tomllib.load(open("vyos-build/scripts/package-build/linux-kernel/package.toml", "rb"))["dependencies"]["packages"], sep="\n")')
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            "${dependencies[@]}"

      - name: Fetch verified kernel and firmware sources
        working-directory: fullcone
        shell: bash
        run: |
          set -euo pipefail
          kernel=$(sed -n 's/^kernel_version = "\([^"]*\)"/\1/p' ../vyos-build/data/defaults.toml)
          firmware=$(awk '
            $0 == "name = \"linux-firmware\"" { found=1; next }
            found && /^commit_id = / { gsub(/\"/, "", $3); print $3; exit }
          ' ../vyos-build/scripts/package-build/linux-kernel/package.toml)
          test -n "$kernel"
          test -n "$firmware"

          gpg --batch --locate-keys torvalds@kernel.org gregkh@kernel.org
          curl -fLO --retry 3 "https://www.kernel.org/pub/linux/kernel/v6.x/linux-${kernel}.tar.xz"
          curl -fLO --retry 3 "https://www.kernel.org/pub/linux/kernel/v6.x/linux-${kernel}.tar.sign"
          xz -cd "linux-${kernel}.tar.xz" | gpg --verify "linux-${kernel}.tar.sign" -
          tar xf "linux-${kernel}.tar.xz"
          ln -s "linux-${kernel}" linux

          git clone --filter=blob:none --no-checkout \
            https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git
          git -C linux-firmware checkout "$firmware"

      - name: Build kernel, Intel QAT driver, and firmware packages
        working-directory: fullcone
        shell: bash
        run: |
          set -euo pipefail
          export KERNEL_FLAVOR=$(sed -n 's/^kernel_flavor = "\([^"]*\)"/\1/p' ../vyos-build/data/defaults.toml)
          test -n "$KERNEL_FLAVOR"
          ./build-kernel.sh
          ./build-intel-qat.sh
          ./build-linux-firmware.sh

      - name: Verify packages
        id: meta
        working-directory: fullcone
        shell: bash
        run: |
          set -euo pipefail
          kernel=$(sed -n 's/^kernel_version = "\([^"]*\)"/\1/p' ../vyos-build/data/defaults.toml)
          flavor=$(sed -n 's/^kernel_flavor = "\([^"]*\)"/\1/p' ../vyos-build/data/defaults.toml)
          image=$(find . -maxdepth 1 -type f -name "linux-image-${kernel}-${flavor}_*.deb" -print -quit)
          qat=$(find . -maxdepth 1 -type f -name 'vyos-intel-qat_*.deb' -print -quit)
          firmware=$(find . -maxdepth 1 -type f -name 'vyos-linux-firmware_*.deb' -print -quit)
          test -n "$image"
          test -n "$qat"
          test -n "$firmware"

          mkdir kernel-root qat-root
          dpkg-deb --extract "$image" kernel-root
          dpkg-deb --extract "$qat" qat-root
          test -n "$(find kernel-root -type f -name 'nft_fullcone.ko*' -print -quit)"
          test -n "$(find qat-root -type f -name '*.ko*' -print -quit)"
          test "$(dpkg-deb --field "$image" Package)" = "linux-image-${kernel}-${flavor}"
          test "$(dpkg-deb --field "$image" Version)" = "${kernel}-1"
          test "$(dpkg-deb --field "$qat" Package)" = vyos-intel-qat
          test "$(dpkg-deb --field "$firmware" Package)" = vyos-linux-firmware

          echo "artifact=vyos-kernel-${kernel}-fullcone" >> "$GITHUB_OUTPUT"
          echo "tag=${kernel}-fullcone.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: fullcone/*.deb
          retention-days: 7
          if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout boot test
        uses: actions/checkout@v6
        with:
          path: fullcone

      - name: Download kernel packages
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: kernel-packages

      - name: Build Debian test initramfs
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cpio debootstrap qemu-system-x86
          sudo debootstrap --variant=minbase trixie rootfs http://deb.debian.org/debian
          sudo chroot rootfs apt-get install -y --no-install-recommends \
            conntrack iproute2 kmod nftables socat

          mkdir fullcone-packages
          download() {
            url=$1
            sha256=$2
            file="fullcone-packages/${url##*/}"
            curl -fL --retry 3 -o "$file" "$url"
            echo "$sha256  $file" | sha256sum --check -
          }
          download https://github.com/homerouter/libnftnl-fullcone/releases/download/1.3.2-1/libnftnl11_1.3.2-1_amd64.deb \
            0b8d23f7cb0b190213a862002baf51ab5ff8f0e5e081b8a0edd7f082553a7158
          download https://github.com/homerouter/nftables-fullcone/releases/download/1.1.7-1/libnftables1_1.1.7-1_amd64.deb \
            ef911f2b628e40434d18adc0bebdc82ed75994bc971a52d84304c3e215e4d45e
          download https://github.com/homerouter/nftables-fullcone/releases/download/1.1.7-1/nftables_1.1.7-1_amd64.deb \
            dc32985b2d69de10a87e63a26d9251d485ec07eb6945d81ee959b28fa1610175

          sudo cp fullcone-packages/*.deb rootfs/tmp/
          sudo chroot rootfs sh -c 'dpkg -i /tmp/*.deb'
          image=$(find kernel-packages -maxdepth 1 -type f -name 'linux-image-*.deb' -print -quit)
          test -n "$image"
          sudo dpkg-deb --extract "$image" rootfs
          sudo install -m 0755 fullcone/tests/fullcone-boot-test.sh rootfs/init
          sudo rm -f rootfs/dev/console
          sudo mknod -m 0600 rootfs/dev/console c 5 1
          cp rootfs/boot/vmlinuz-* vmlinuz
          sudo sh -c 'cd rootfs && find . -print0 | cpio --null -o --format=newc | gzip -1 > ../initramfs.cpio.gz'

      - name: Boot and exercise both Fullcone paths
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=KILL 180s qemu-system-x86_64 \
            -machine accel=tcg \
            -cpu max \
            -m 768M \
            -smp 2 \
            -kernel vmlinuz \
            -initrd initramfs.cpio.gz \
            -append 'console=ttyS0 rdinit=/init panic=-1' \
            -nographic \
            -no-reboot 2>&1 | tr -d '\r' | tee console.log
          grep -q '^FULLCONE_PATH_PASS name=fullcone ' console.log
          grep -q '^FULLCONE_PATH_PASS name=brcm ' console.log
          grep -q '^FULLCONE_TEST_PASS$' console.log

      - name: Upload boot log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.build.outputs.artifact }}-boot-log
          path: console.log
          retention-days: 7
          if-no-files-found: ignore

  release:
    needs: [build, test]
    runs-on: ubuntu-24.04
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        shell: bash
        run: |
          gh release create "$TAG" release/*.deb \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "VyOS rolling kernel $TAG" \
            --notes "VyOS rolling kernel, Intel QAT driver, and selected firmware built by the repository's shell scripts. The homerouter/aports Fullcone and Broadcom Fullcone paths passed the QEMU network-namespace test." \
            --prerelease
